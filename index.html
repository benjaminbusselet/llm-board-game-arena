<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Jeu</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
</head>

<body>

    <header class="mt-4 mb-4">
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-12 text-center">
                    <h1 id="title"></h1>
                </div>
            </div>
        </div>
    </header>

    <div id="game">
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-3 text-center" data-player="0">
                    <div class="avatar row mx-auto"></div>
                    <h4 class="mt-3">Arme</h4>
                    <img class="weapon-img" src="" alt="">
                    <h4 class="mt-3">Force</h4>
                    <h3 class="weapon-force"></h3>
                    <h1 class="mt-3">Score</h1>
                    <h1 class="hp"></h1>
                </div>
                <div class="col-sm-6">
                    <table class="mt-0" id="gameboard"></table>
                </div>
                <div class="col-sm-3 text-center" data-player="1">
                    <div class="avatar row mx-auto"></div>
                    <h4 class="mt-3">Arme</h4>
                    <img class="weapon-img" src="" alt="">
                    <h4 class="mt-3">Force</h4>
                    <h3 class="weapon-force"></h3>
                    <h1 class="mt-3">Score</h1>
                    <h1 class="hp"></h1>
                </div>
            </div>
        </div>
    </div>

    <footer class="mt-3">
        <div class="container-fluid">
            <div class="row">
                <div class="col-sm-12 text-center">
                    <h2 id="status"></h2>
                </div>
            </div>
            <div class="row mt-3 mb-4">
                <div class="col-sm-12 text-center">
                    <button type="button" class="btn btn-success" id="attack" hidden>Attaque</button>
                    <button type="button" class="btn btn-danger" id="defend" hidden>Défense</button>
                    <button type="button" class="btn btn-primary" id="reload" hidden>Rejouer</button>
                </div>
            </div>
        </div>
    </footer>
    <script type="module" src="/src/ui/main.js"></script>
</body>

</html>
